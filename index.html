<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Match-3 Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: Arial, sans-serif; background: linear-gradient(#7ec8f7, #3a7bd5); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; }
h1 { margin: 8px 0; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
.hud { display: flex; gap: 8px; margin: 8px 0 12px; flex-wrap: wrap; justify-content: center; }
.pill { background: #fff; color: #333; border-radius: 20px; padding: 8px 14px; font-weight: bold; font-size: 15px; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
#board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background: rgba(255,255,255,.25); padding: 6px; border-radius: 14px; width: min(94vw, 420px); }
.tile { aspect-ratio: 1; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .15s; user-select: none; }
.tile.selected { outline: 3px solid #ffd93d; transform: scale(1.08); }
button { margin-top: 14px; padding: 12px 28px; font-size: 18px; font-weight: bold; border: none; border-radius: 25px; background: #ffd93d; color: #333; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,.3); }
#msg { margin-top: 10px; font-size: 18px; font-weight: bold; min-height: 24px; text-align: center; }
.hint { margin-top: 6px; font-size: 13px; opacity: .9; text-align: center; max-width: 420px; }
</style>
</head>
<body>
<h1>🍬 Match-3 Game 🍬</h1>
<div class="hud">
  <div class="pill">⭐ Score: <span id="score">0</span></div>
  <div class="pill">🪙 Coins: <span id="coins">0</span></div>
  <div class="pill">🎯 Target: 500</div>
  <div class="pill">🎮 Moves: <span id="moves">30</span></div>
</div>
<div id="board"></div>
<div id="msg"></div>
<button onclick="newGame()">🔄 New Game</button>
<p class="hint">Ek item par tap karo, phir us ke paas wale item par tap karo — 3 ya zyada ek jaise milao!</p>

<script>
const ITEMS = ['🍎', '🍓', '🍇', '🌸', '🌼', '🍩'];
const ROWS = 8, COLS = 8, TARGET = 500, START_MOVES = 30;
let board = [], score = 0, coins = 0, moves = START_MOVES;
let selected = null, busy = false, over = false;

function rand() { return Math.floor(Math.random() * ITEMS.length); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function newGame() {
  score = 0; coins = 0; moves = START_MOVES;
  selected = null; busy = false; over = false;
  document.getElementById('msg').textContent = '';
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let v;
      do {
        v = rand();
      } while (
        (c >= 2 && board[r][c-1] === v && board[r][c-2] === v) ||
        (r >= 2 && board[r-1][c] === v && board[r-2][c] === v)
      );
      board[r][c] = v;
    }
  }
  updateHUD();
  render();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('coins').textContent = coins;
  document.getElementById('moves').textContent = moves;
}

function render() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const d = document.createElement('div');
      d.className = 'tile';
      if (selected && selected.r === r && selected.c === c) d.classList.add('selected');
      d.textContent = board[r][c] === -1 ? '' : ITEMS[board[r][c]];
      d.onclick = () => onTile(r, c);
      b.appendChild(d);
    }
  }
}

function swap(a, b) {
  const t = board[a.r][a.c];
  board[a.r][a.c] = board[b.r][b.c];
  board[b.r][b.c] = t;
}

function onTile(r, c) {
  if (busy || over) return;
  if (!selected) { selected = { r, c }; render(); return; }
  const d = Math.abs(selected.r - r) + Math.abs(selected.c - c);
  if (d === 1) {
    const a = selected;
    selected = null;
    swap(a, { r, c });
    render();
    if (findMatches().size > 0) {
      moves--;
      updateHUD();
      resolve();
    } else {
      swap(a, { r, c });
      setTimeout(render, 150);
    }
  } else {
    selected = { r, c };
    render();
  }
}

function findMatches() {
  const matched = new Set();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      const v = board[r][c];
      if (v !== -1 && v === board[r][c+1] && v === board[r][c+2]) {
        matched.add(r + ',' + c);
        matched.add(r + ',' + (c+1));
        matched.add(r + ',' + (c+2));
      }
    }
  }
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      const v = board[r][c];
      if (v !== -1 && v === board[r+1][c] && v === board[r+2][c]) {
        matched.add(r + ',' + c);
        matched.add((r+1) + ',' + c);
        matched.add((r+2) + ',' + c);
      }
    }
  }
  return matched;
}

async function resolve() {
  busy = true;
  while (true) {
    const m = findMatches();
    if (m.size === 0) break;
    score += m.size * 10;
    coins += m.size;
    m.forEach(key => {
      const parts = key.split(',');
      board[+parts[0]][+parts[1]] = -1;
    });
    updateHUD();
    render();
    await sleep(250);
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== -1) { board[write][c] = board[r][c]; write--; }
      }
      for (let r = write; r >= 0; r--) board[r][c] = rand();
    }
    render();
    await sleep(200);
  }
  busy = false;
  checkEnd();
}

function checkEnd() {
  if (score >= TARGET) {
    over = true;
    document.getElementById('msg').textContent = '🎉 Jeet gaye! Mubarak ho!';
  } else if (moves <= 0) {
    over = true; 
    document.getElementById('msg').textContent = '😢 Moves khatam! Dobara try karo.';
  }
}

newGame();
</script>
</body>
</html>
